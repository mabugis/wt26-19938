<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<title>Tutorijal 1, Zadatak 2</title>
<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
<table border="1" cellspacing="0" cellpadding="8">
	<caption>Bodovanje po predmetima</caption>
	<thead>
		<tr>
			<th></th>
			<th>Ispiti</th>
			<th>Zadaće</th>
			<th>Prisustvo</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<td class="predmet">PNWT</td>
			<td>20</td>
			<td>10</td>
			<td>10</td>
		</tr>
		<tr>
			<td class="predmet">MMS</td>
			<td>20</td>
			<td colspan="2">30</td>
		</tr>
		<tr>
			<td class="predmet" rowspan="2">SI</td>
			<td>20/2</td>
			<td>10</td>
			<td>10</td>
		</tr>
		<tr>
			<td>20</td>
			<td colspan="2">?</td>
		</tr>
	</tbody>
</table>
</body>
</html>
